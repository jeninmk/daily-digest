[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-digest"
version = "0.1.0"
description = "Personal morning digest: articles and trending products, delivered by email on your schedule"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
digest = "digest.cli:main"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
